name: build-watch-app

# Compiles the watch client on every push that touches it, and publishes the
# resulting (unsigned) APK as a build artifact. Release signing is intentionally
# not part of CI: the keystore is not in the repository.
#
# Manual run: Actions → build-watch-app → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'watch-app/**'
      - '.github/workflows/build-watch-app.yml'
  pull_request:
    paths:
      - 'watch-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "$ANDROID_SDK_ROOT" > local.properties.tmp
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Collect artifact
        run: |
          ls -l app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/watch-app-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-watch-chat-apk
          path: watch-app-release.apk
          if-no-files-found: error
