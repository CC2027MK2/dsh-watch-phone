plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.watchchat'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.dsh.watchchat"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters 'armeabi-v7a', 'armeabi', 'arm64-v8a'
        }
    }

    // Signing is opt-in: put keystore.properties next to settings.gradle (it is git-ignored).
    //   storeFile=../my-release.keystore
    //   storePassword=...
    //   keyAlias=...
    //   keyPassword=...
    // Without it `assembleRelease` still produces app-release-unsigned.apk.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def hasKeystore = keystorePropsFile.exists()
    def keystoreProps = new Properties()
    if (hasKeystore) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
