- insert:
    - id: watch-phone
      name: dsh-watch-phone
      config:
        port: 38402
        # Leave empty on the first run: the bridge mints a token, writes it to
        # <home>/.dsh/watch-phone/token, logs it, and listens on loopback only.
        # Copy that value here (and into the watch) to serve the LAN.
        token: ''
        sessionId: watch-voice
        # The watch finds the phone on whatever network both share by
        # broadcasting 'dsh-watch?' to this UDP port.
        discoveryPort: 38403
        # /exec and /relay are opt-in: a default install exposes chat + voice only.
        allowExec: false
        allowRelay: false
