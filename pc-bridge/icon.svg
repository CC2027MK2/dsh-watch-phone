<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="watch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- watch band top -->
  <rect x="108" y="18" width="40" height="42" rx="12" fill="url(#watch)" opacity="0.85"/>
  <!-- watch band bottom -->
  <rect x="108" y="196" width="40" height="42" rx="12" fill="url(#watch)" opacity="0.85"/>
  <!-- watch body -->
  <rect x="72" y="52" width="112" height="152" rx="32" fill="url(#watch)"/>
  <!-- watch screen -->
  <rect x="84" y="66" width="88" height="124" rx="22" fill="url(#screen)"/>
  <!-- speech waveform (voice input) -->
  <g transform="translate(128,128)" stroke="url(#wave)" stroke-width="6" stroke-linecap="round">
    <line x1="-28" y1="0" x2="-28" y2="12" opacity="0.7"/>
    <line x1="-18" y1="-10" x2="-18" y2="22" opacity="0.85"/>
    <line x1="-8"  y1="-22" x2="-8"  y2="34"/>
    <line x1="2"   y1="-16" x2="2"   y2="28"/>
    <line x1="12"  y1="-26" x2="12"  y2="38"/>
    <line x1="22"  y1="-12" x2="22"  y2="24" opacity="0.85"/>
    <line x1="32"  y1="-4"  x2="32"  y2="16" opacity="0.7"/>
  </g>
  <!-- mic icon (small, top-left of screen) -->
  <g transform="translate(96,80)" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round">
    <rect x="-4" y="-12" width="8" height="16" rx="4" fill="#e0f2fe" stroke="none"/>
    <path d="M-8 2 Q-8 10 0 10 Q8 10 8 2" />
    <line x1="0" y1="10" x2="0" y2="14" />
    <line x1="-5" y1="14" x2="5" y2="14" />
  </g>
</svg>
