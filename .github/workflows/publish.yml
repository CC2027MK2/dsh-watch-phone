name: publish

# Publishes to npm with Trusted Publishing (OIDC): no npm token is stored in this
# repository or in GitHub secrets. npm verifies the workflow's identity instead.
#
# One-time setup on npmjs.com → package dsh-watch-phone → Settings → Trusted
# Publisher: add this repository and the workflow filename `publish.yml`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm publish cannot authenticate

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify syntax
        run: node --check index.js

      - name: Smoke test the bundle
        run: node smoke.mjs

      - name: Publish
        run: npm publish --provenance --access public
